document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;\n  --color-accent-2-800: #423e5d;\n  --color-accent-2-900: #2b293a;\n\n  /* Deck section-divider ground — review round 3: saturation as presence.\n     Dividers take a saturated deep indigo (hue 277, the neutral ramp's own\n     family; C 0.094 — written when the accent held C 0.030, before the\n     round-7 blurple raised it past the ground's) with a lighter bloom and\n     a ghost tint of the same hue, while the slide grounds stay\n     desaturated. Deck-scale fills only — not interface colors. */\n  --color-section: #262a60;\n  --color-section-glow: #353b80;\n  --color-section-ghost: #4c5397;\n\n  --font-heading: \"Inter\", system-ui, sans-serif;\n  --font-heading-weight: 500;\n  --font-body: \"Inter\", system-ui, sans-serif;\n\n  --space-1: 2.8px;\n  --space-2: 5.6px;\n  --space-3: 8.4px;\n  --space-4: 11.2px;\n  --space-6: 16.8px;\n  --space-8: 22.4px;\n\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 14px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 0 0 1px #3f424d;\n  --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);\n  --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.lighten{mix-blend-mode:lighten;background-color:transparent}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n/* Rules fade to transparent at both ends instead of stopping cleanly — a\n   Nocturne signature. The ramp is 48px an end (one deck baseline unit),\n   painted from the same divider token. Freestanding rules fade; box\n   outlines, in-control separators, and short accent marks stay solid. */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-800); color: var(--color-accent-100); }\n.tag-accent-2 { background: var(--color-accent-2-800); color: var(--color-accent-2-100); }\n.tag-neutral { background: var(--color-neutral-800); color: var(--color-neutral-100); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid transparent; /* keeps layout; the row paints the fading rule */\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid transparent;\n}\n/* Row rules as row-level strips so the end-fade spans the row, not each cell. */\n.table thead tr {\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr {\n  background: linear-gradient(to right,\n    transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n    color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr:hover {\n  /* the hover tint layers over the row rule, which keeps painting */\n  background:\n    linear-gradient(color-mix(in srgb, var(--color-text) 4%, transparent),\n                    color-mix(in srgb, var(--color-text) 4%, transparent)) no-repeat 0 0 / 100% 100%,\n    linear-gradient(to right,\n      transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n      color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"1d5259c2-65e2-4da3-93cc-c8f202afa17e\"><\u002Fscript>\n<style>\nbody { margin: 0; background: #161826; text-wrap: pretty; }\nhtml { scroll-behavior: smooth; }\na { color: var(--color-accent); text-underline-offset: 3px; }\na:hover { color: var(--color-accent-300); }\n@media (max-width: 860px) {\n  [data-r=\"svc\"], [data-r=\"cost\"] { grid-template-columns: 1fr !important; gap: 14px !important; }\n  [data-r=\"svcnum\"] { line-height: 20px !important; }\n}\n@media (max-width: 700px) {\n  [data-r=\"navlink\"] { display: none !important; }\n  [data-r=\"hero\"] { padding-top: 56px !important; padding-bottom: 48px !important; }\n  [data-r=\"sec\"] { padding-top: 56px !important; padding-bottom: 48px !important; }\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100%;font-family:var(--font-body);color:var(--color-text);background:radial-gradient(1200px 720px at 82% -160px, color-mix(in srgb, var(--color-accent-900) 75%, transparent), transparent 60%), radial-gradient(1100px 800px at -10% 100%, color-mix(in srgb, black 30%, transparent), transparent 55%), var(--color-bg);\">\n\n<nav class=\"nav\" style=\"padding-inline:max(clamp(20px,5vw,72px), calc((100% - 1200px) / 2 + clamp(20px,5vw,72px)));padding-block:18px;gap:24px;\">\n<span class=\"nav-brand\" style=\"margin-right:auto;\">Ben O’Loghlin <span style=\"color:color-mix(in srgb, var(--color-text) 58%, transparent);\">&amp; Associates<\u002Fspan><\u002Fspan>\n<a href=\"#problem\" data-r=\"navlink\" style=\"font-size:14px;white-space:nowrap;text-decoration:none;color:color-mix(in srgb, var(--color-text) 72%, transparent);\">The cost<\u002Fa>\n<a href=\"#services\" data-r=\"navlink\" style=\"font-size:14px;white-space:nowrap;text-decoration:none;color:color-mix(in srgb, var(--color-text) 72%, transparent);\">Services<\u002Fa>\n<a href=\"#start\" data-r=\"navlink\" style=\"font-size:14px;white-space:nowrap;text-decoration:none;color:color-mix(in srgb, var(--color-text) 72%, transparent);\">How we start<\u002Fa>\n<a href=\"#about\" data-r=\"navlink\" style=\"font-size:14px;white-space:nowrap;text-decoration:none;color:color-mix(in srgb, var(--color-text) 72%, transparent);\">About<\u002Fa>\n<a class=\"btn btn-primary\" href=\"https://calendar.app.google/1YefWYnvzJz3ri6A9\" style=\"white-space:nowrap;\">Book a call<\u002Fa>\n<\u002Fnav>\n\n<div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px);\">\n<section data-r=\"hero\" style=\"padding:112px 0 84px;\">\n<h1 style=\"font-size:clamp(40px,5.6vw,76px);line-height:clamp(44px,6.2vw,84px);letter-spacing:-0.018em;margin:0 0 0 -0.06em;max-width:17ch;\">Are your deals stalling in security review?<\u002Fh1>\n<p style=\"font-size:19px;line-height:28px;max-width:52ch;margin:34px 0 0;color:var(--color-text);\">Get your SaaS company past procurement without hiring a full-time trust leader.<\u002Fp>\n<p style=\"font-size:16px;line-height:28px;max-width:58ch;margin:20px 0 0;color:color-mix(in srgb, var(--color-text) 74%, transparent);\">Security and compliance reviews are table stakes for any serious buyer. When you can’t answer questionnaires fast, demonstrate SOC&nbsp;2 readiness, show ISO&nbsp;27001 alignment, or prove credible controls — deals stall. I help SaaS companies at $1M–$15M ARR build lightweight trust infrastructure that signals maturity to security-conscious buyers, whether that’s SOC&nbsp;2, ISO&nbsp;27001, or both.<\u002Fp>\n<div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:32px;\">\n<a class=\"btn btn-primary\" href=\"#start\" style=\"min-height:38px;padding-inline:16px;white-space:nowrap;\">Start with a Trust Readiness Audit<\u002Fa>\n<a class=\"btn btn-ghost\" href=\"#services\" style=\"min-height:38px;white-space:nowrap;\">See the three tiers<\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"height:1px;background:linear-gradient(to right, transparent, var(--color-divider) 48px calc(100% - 48px), transparent);\"><\u002Fdiv>\n\n<section id=\"problem\" data-r=\"sec\" style=\"padding:84px 0 70px;scroll-margin-top:24px;\">\n<div style=\"display:flex;align-items:center;gap:16px;margin-bottom:14px;\"><span style=\"width:44px;height:1px;background:var(--color-accent);\"><\u002Fspan><span style=\"font-size:13px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-accent);\">The cost of doing this yourself<\u002Fspan><\u002Fdiv>\n<h2 style=\"font-size:clamp(28px,3.2vw,40px);line-height:1.14;letter-spacing:-0.014em;margin:0 0 12px;max-width:22ch;\">If your team is handling trust internally.<\u002Fh2>\n\n<div data-r=\"cost\" style=\"display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px clamp(24px,4vw,64px);padding:44px 0 40px;align-items:start;\">\n<h3 style=\"font-size:22px;line-height:1.24;letter-spacing:-0.01em;margin:0;\">Procurement doesn’t move fast<\u002Fh3>\n<div>\n<p style=\"font-size:16px;line-height:27px;margin:0 0 16px;max-width:56ch;color:color-mix(in srgb, var(--color-text) 82%, transparent);\">Security questionnaires take time. Questions come back. Your internal person answers them — but they’re splitting focus with other work. A week turns into two. The deal sits.<\u002Fp>\n<p style=\"font-size:16px;line-height:27px;margin:0 0 16px;max-width:56ch;\">A specialist turns around questionnaires in days. Your responses are complete. Procurement moves. You close faster.<\u002Fp>\n<p style=\"font-size:16px;line-height:27px;margin:0;max-width:56ch;color:var(--color-accent-300);\">That’s not a small difference when revenue is waiting on the other side.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"height:1px;background:linear-gradient(to right, transparent, var(--color-neutral-700) 48px calc(100% - 48px), transparent);\"><\u002Fdiv>\n\n<div data-r=\"cost\" style=\"display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px clamp(24px,4vw,64px);padding:40px 0;align-items:start;\">\n<h3 style=\"font-size:22px;line-height:1.24;letter-spacing:-0.01em;margin:0;\">Your team is burning engineering time<\u002Fh3>\n<div>\n<p style=\"font-size:16px;line-height:27px;margin:0 0 20px;max-width:56ch;color:color-mix(in srgb, var(--color-text) 82%, transparent);\">Your VP Engineering is spending 8–15 hours a week on security questionnaires, SOC&nbsp;2 maintenance and vendor reviews. That’s time not spent shipping product.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:12px 28px;padding:20px 0 18px;border-top:1px solid var(--color-neutral-700);border-bottom:1px solid var(--color-neutral-700);margin-bottom:20px;\">\n<span style=\"font-family:var(--font-heading);font-weight:500;font-size:clamp(32px,3.4vw,44px);line-height:1.05;letter-spacing:-0.02em;font-feature-settings:'tnum' 1;\">$80K–$150K<\u002Fspan>\n<span style=\"font-size:13px;letter-spacing:0.06em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 60%, transparent);max-width:26ch;line-height:1.5;\">Engineering capacity spent on compliance, per year — at $200/hr fully loaded<\u002Fspan>\n<\u002Fdiv>\n<p style=\"font-size:16px;line-height:27px;margin:0;max-width:56ch;\">At what growth rate does that trade-off still make sense?<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"height:1px;background:linear-gradient(to right, transparent, var(--color-neutral-700) 48px calc(100% - 48px), transparent);\"><\u002Fdiv>\n\n<div data-r=\"cost\" style=\"display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px clamp(24px,4vw,64px);padding:40px 0 0;align-items:start;\">\n<h3 style=\"font-size:22px;line-height:1.24;letter-spacing:-0.01em;margin:0;\">Credibility takes a hit<\u002Fh3>\n<div>\n<p style=\"font-size:16px;line-height:27px;margin:0;max-width:56ch;color:color-mix(in srgb, var(--color-text) 82%, transparent);\">When security-conscious buyers ask about your controls, they want to talk to someone who <em>specialises<\u002Fem> in this — not an internal ops person juggling five other responsibilities. That credibility gap is real. It slows conversations and raises confidence questions you don’t want raised.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"height:1px;background:linear-gradient(to right, transparent, var(--color-divider) 48px calc(100% - 48px), transparent);\"><\u002Fdiv>\n\n<section id=\"services\" data-r=\"sec\" style=\"padding:84px 0 56px;scroll-margin-top:24px;\">\n<div style=\"display:flex;align-items:center;gap:16px;margin-bottom:14px;\"><span style=\"width:44px;height:1px;background:var(--color-accent);\"><\u002Fspan><span style=\"font-size:13px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-accent);\">What I do<\u002Fspan><\u002Fdiv>\n<h2 style=\"font-size:clamp(28px,3.2vw,40px);line-height:1.14;letter-spacing:-0.014em;margin:0 0 40px;max-width:22ch;\">Three service tiers. Pick what fits your stage.<\u002Fh2>\n\n<div data-r=\"svc\" style=\"display:grid;grid-template-columns:32px minmax(0,270px) minmax(0,1fr);gap:24px clamp(24px,4vw,64px);padding:36px 0 40px;align-items:start;\">\n<p data-r=\"svcnu font-size:14px;font-feature-settings:'tnum' 1;color:color-mix(in srgb, var(--color-text) 62%, transparent);\">$4K–$12K / mo<\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-size:11px;letter-spacing:0.09em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 55%, transparent);margin:0 0 12px;\">Three tiers within your chosen framework(s)<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:22px;\">\n<div class=\"card\" style=\"padding:16px;gap:6px;\">\n<span class=\"card-kicker\">Advisor<\u002Fspan>\n<sc-if value=\"{{ showPricing }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"card-title\" style=\"font-feature-settings:'tnum' 1;\">$2K–$3.5K / mo<\u002Fspan><\u002Fsc-if>\n<span style=\"font-size:14px;line-height:21px;color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Questionnaire drafting, security call prep<\u002Fspan>\n<\u002Fdiv>\n<div class=\"card\" style=\"padding:16px;gap:6px;box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--color-accent) 40%, transparent);\">\n<span class=\"card-kicker\">Operator<\u002Fspan>\n<sc-if value=\"{{ showPricing }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"card-title\" style=\"font-feature-settings:'tnum' 1;\">$4K–$7K / mo<\u002Fspan><\u002Fsc-if>\n<span style=\"font-size:14px;line-height:21px;color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Active program ownership and control framework maintenance<\u002Fspan>\n<\u002Fdiv>\n<div class=\"card\" style=\"padding:16px;gap:6px;\">\n<span class=\"card-kicker\">Head of Trust<\u002Fspan>\n<sc-if value=\"{{ showPricing }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"card-title\" style=\"font-feature-settings:'tnum' 1;\">$8K–$12K / mo<\u002Fspan><\u002Fsc-if>\n<span style=\"font-size:14px;line-height:21px;color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Full leadership across your chosen framework(s)<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-size:11px;letter-spacing:0.09em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 55%, transparent);margin:0 0 12px;\">Includes<\u002Fp>\n<ul style=\"margin:0 0 18px;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 24px;font-size:15px;line-height:22px;color:color-mix(in srgb, var(--color-text) 82%, transparent);\">\n<li>Security questionnaire response and completion<\u002Fli>\n<li>Security review calls with buyers<\u002Fli>\n<li>SOC&nbsp;2 control framework design and operation (if chosen)<\u002Fli>\n<li>ISO&nbsp;27001 program design, ISMS documentation and management (if chosen)<\u002Fli>\n<li>Policies, vendor risk management, privacy documentation<\u002Fli>\n<\u002Ful>\n<p style=\"font-size:15px;line-height:24px;margin:0;color:color-mix(in srgb, var(--color-text) 74%, transparent);\"><span style=\"color:var(--color-accent-300);\">Outcome —<\u002Fspan> buyers gain confidence in your security posture. Your team focuses on product.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"height:1px;background:linear-gradient(to right, transparent, var(--color-neutral-700) 48px calc(100% - 48px), transparent);\"><\u002Fdiv>\n\n<div data-r=\"svc\" style=\"display:grid;grid-template-columns:32px minmax(0,270px) minmax(0,1fr);gap:24px clamp(24px,4vw,64px);padding:40px 0 8px;align-items:start;\">\n<p data-r=\"svcnum\" style=\"font-family:var(--font-heading);font-weight:500;font-size:15px;line-height:28px;color:var(--color-accent);margin:0;font-feature-settings:'tnum' 1;\">03<\u002Fp>\n<div>\n<h3 style=\"font-size:24px;line-height:1.2;letter-spacing:-0.01em;margin:0 0 12px;\">Specific projects<\u002Fh3>\n<p style=\"font-size:15px;line-height:24px;margin:0;color:color-mix(in srgb, var(--color-text) 74%, transparent);\">Scoped, one-off work when you already know what you need.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:24px 40px;\">\n<div>\n<p style=\"font-size:11px;letter-spacing:0.09em;text-transform:uppercase;color:var(--color-accent);margin:0 0 12px;\">SOC 2 work<\u002Fp>\n<ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:22px;color:color-mix(in srgb, var(--color-text) 82%, transparent);\">\n<li>Control framework design and maintenance<\u002Fli>\n<li>Evidence collection and audit coordination<\u002Fli>\n<li>Policy suite build-out<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div>\n<p style=\"font-size:11px;letter-spacing:0.09em;text-transform:uppercase;color:var(--color-accent);margin:0 0 12px;\">ISO 27001 work<\u002Fp>\n<ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:22px;color:color-mix(in srgb, var(--color-text) 82%, transparent);\">\n<li>Gap analysis and Annex&nbsp;A control mapping<\u002Fli>\n<li>ISMS scope and risk treatment documentation<\u002Fli>\n<li>Certification body selection and audit preparation<\u002Fli>\n<li>Certification readiness review<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div>\n<p style=\"font-size:11px;letter-spacing:0.09em;text-transform:uppercase;color:var(--color-accent);margin:0 0 12px;\">Both frameworks<\u002Fp>\n<ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:22px;color:color-mix(in srgb, var(--color-text) 82%, transparent);\">\n<li>Contract stack and vendor risk review<\u002Fli>\n<li>Data breach response planning<\u002Fli>\n<li>DPO support for GDPR compliance<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n\n<section aria-label=\"Who this works for\" style=\"background:radial-gradient(900px 420px at 85% -40%, color-mix(in srgb, var(--color-section-glow) 70%, transparent), transparent 64%), var(--color-section);padding:76px 0;margin-top:40px;\">\n<div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw  0;\">Review phase · 2–3 weeks<\u002Fp>\n<p style=\"font-size:15px;line-height:23px;margin:0;color:color-mix(in srgb, var(--color-text) 72%, transparent);\">I assess your position against your chosen framework(s).<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;\">\n<span style=\"font-family:var(--font-heading);font-weight:500;font-size:13px;color:var(--color-accent);font-feature-settings:'tnum' 1;\">03<\u002Fspan>\n<span style=\"height:1px;background:var(--color-neutral-700);\"><\u002Fspan>\n<p style=\"font-family:var(--font-heading);font-weight:500;font-size:17px;margin:6px 0 0;\">Audit report<\u002Fp>\n<p style=\"font-size:15px;line-height:23px;margin:0;color:color-mix(in srgb, var(--color-text) 72%, transparent);\">Where you stand, what gaps exist, what to prioritise, and what it will take to reach certification readiness.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;\">\n<span style=\"font-family:var(--font-heading);font-weight:500;font-size:13px;color:var(--color-accent);font-feature-settings:'tnum' 1;\">04<\u002Fspan>\n<span style=\"height:1px;background:var(--color-neutral-700);\"><\u002Fspan>\n<p style=\"font-family:var(--font-heading);font-weight:500;font-size:17px;margin:6px 0 0;\">Debrief call<\u002Fp>\n<p style=\"font-size:15px;line-height:23px;margin:0;color:color-mix(in srgb, var(--color-text) 72%, transparent);\">Walk through findings together and agree the next steps.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{ showPricing }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"margin-top:56px;max-width:760px;overflow-x:auto;\">\n<p style=\"font-size:11px;letter-spacing:0.09em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 55%, transparent);margin:0 0 8px;\">Audit pricing<\u002Fp>\n<sc-raw-table class=\"table\" style=\"width:100%;min-width:520px;\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th>Scope<\u002Fsc-raw-th><sc-raw-th>What it covers<\u002Fsc-raw-th><s atters versus what you can skip.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"height:1px;background:linear-gradient(to right, transparent, var(--color-divider) 48px calc(100% - 48px), transparent);\"><\u002Fdiv>\n\n<section id=\"contact\" data-r=\"sec\" style=\"padding:76px 0 40px;scroll-margin-top:24px;\">\n<h2 style=\"font-size:clamp(28px,3.4vw,44px);line-height:1.14;letter-spacing:-0.016em;margin:0;max-width:20ch;\">Ready to close deals faster?<\u002Fh2>\n<p style=\"font-size:16px;line-height:28px;margin:20px 0 0;max-width:52ch;color:color-mix(in srgb, var(--color-text) 78%, transparent);\">Let’s start with a conversation about your current trust maturity and what’s blocking deals.<\u002Fp>\n<div style=\"display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:28px;\">\n<a class=\"btn btn-primary\" href=\"https://calendar.app.google/1YefWYnvzJz3ri6A9\" style=\"min-height:38px;padding-inline:16px;white-space:nowrap;\">Schedule a 15-min call<\u002Fa>\n<a class=\"btn btn-ghost\" href=\"mailto:ben@benologhlin.com\" style=\"min-height:38px;white-space:nowrap;\">ben@benologhlin.com<\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"display:flex;flex-wrap:wrap;gap:16px 28px;align-items:baseline;padding:32px 0 56px;font-size:13px;color:color-mix(in srgb, var(--color-text) 55%, transparent);\">\n<span style=\"margin-right:auto;\">Ben O’Loghlin &amp; Associates — trust and compliance consulting<\u002Fspan>\n<a href=\"mailto:ben@benologhlin.com\" style=\"text-decoration:none;\">ben@benologhlin.com<\u002Fa>\n<a href=\"https://linkedin.com/in/benologhlin\" style=\"text-decoration:none;\">LinkedIn<\u002Fa>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showPricing&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nclass Component extends DCLogic {\n  renderVa
